# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod
mod_id=openmodularlighting
mod_name=Open Modular Lighting
mod_version=1.0.0
maven_group=omtteam.openmodularlighting
archives_base_name=openmodularlighting

# OpenModularCore (JitPack): the core module whose classes this jar bundles, and its version, the same in every mod and
# every workspace (see omlib/build-logic/mod-common, "OpenModularCore")
core_module=oml-core
core_version=2.2.0

# Dependencies of all nodes
fabric_loader_version=0.19.5
junit_version=6.1.3
# Architecture rules as unit tests (test only, Fabric node)
archunit_version=1.5.1
# Code quality report (./gradlew pmdMain pmdClient, report only)
pmd_version=7.28.0
# Test coverage of the mod's own classes (printed by check, active node only)
jacoco_version=0.8.15
# Mutation testing of the config classes (./gradlew :1.21.11-fabric:pitest, on demand)
pitest_version=1.30.0
pitest_junit5_version=1.2.3
# Thresholds of the pitest task, the state of 2026-11-18 (PIT rounds the percentages): it fails when fewer
# mutations are detected, less is covered or more are not detected than here. Lower pitest_max_surviving when a
# test kills one; raise it only for a survivor that no test can notice, listed with its reason in the docs.
pitest_mutation_threshold=100
pitest_coverage_threshold=100
pitest_max_surviving=0

# Publishing (./gradlew chiseledPublish). Tokens are NOT stored here: set the environment variables
# CURSEFORGE_TOKEN / MODRINTH_TOKEN, or curseforge_token / modrinth_token in ~/.gradle/gradle.properties.
# Without a token the upload for that site runs as a dry run. An empty project id skips that site.
# release_type: release, beta or alpha
release_type=release
curseforge_project_id=268178
modrinth_project_id=4yAD8NG9
