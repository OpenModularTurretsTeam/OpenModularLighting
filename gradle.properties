# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod (shared across all Minecraft versions)
mod_id=openmodularlighting
mod_name=Open Modular Lighting
mod_version=1.0.0-beta.8
maven_group=omtteam.openmodularlighting
archives_base_name=openmodularlighting

# Shared dependencies
fabric_loader_version=0.19.5
junit_version=6.1.3
# Architecture rules as unit tests (test only, Fabric nodes)
archunit_version=1.5.1
# Code quality report (./gradlew pmdMain pmdClient, report only)
pmd_version=7.28.0
# Test coverage of core (printed by check, active version only)
jacoco_version=0.8.15
# Mutation testing of core (./gradlew :1.21.1-fabric:pitest, on demand)
pitest_version=1.30.0
pitest_junit5_version=1.2.3

# Publishing (./gradlew chiseledPublish). Tokens are NOT stored here: set the environment variables
# CURSEFORGE_TOKEN / MODRINTH_TOKEN, or curseforge_token / modrinth_token in ~/.gradle/gradle.properties.
# Without a token the upload for that site runs as a dry run. An empty project id skips that site.
# release_type: release, beta or alpha
release_type=beta
curseforge_project_id=268178
modrinth_project_id=4yAD8NG9
