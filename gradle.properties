# Gradle
org.gradle.jvmargs=-Xmx3G

# Mod
mod_id=openmodularlighting
mod_name=Open Modular Lighting
mod_version=1.0.0-beta.9
maven_group=omtteam.openmodularlighting
archives_base_name=openmodularlighting

# Minecraft 1.12.2 / Forge (RetroFuturaGradle picks the matching Forge build itself)
minecraft_version=1.12.2
java_version=8
# MCP mappings: stable_39 (the final 1.12 names), the same in all OMTTeam 1.12 mods (one dev run, one set of names)
mapping_channel=stable
mapping_version=39

# OMLib (required): the OMLib version the jar needs at least, as OMLib's gradle.properties composes it (the build puts
# it into OML.DEPENDENCIES). Built against that OMLib jar from mavenLocal (in OMLib: ./gradlew -b build.gradle publishToMavenLocal)
omlib_version=4.0.0-beta.6
# Hwyla 1.8.26-B41 (block info overlay, optional): its CurseForge file id (curse.maven:hwyla-253449:<id>)
hwyla_curse_file_id=2568751

# Unit tests (JUnit 5: the last line that runs on Java 8)
junit_version=5.13.4
# 3.x is the last EqualsVerifier line running on Java 8
equalsverifier_version=3.19.4
# Mutation testing of core (./gradlew pitest, on demand); PIT 1.17 is the last release running on Java 8
pitest_version=1.17.4
pitest_junit5_version=1.2.1

# Publishing (./gradlew release, or ./release.sh in the OMTTeam 1.12 workspace; ./gradlew publishMods uploads only). Tokens are NOT stored here: set the environment variables
# CURSEFORGE_TOKEN / MODRINTH_TOKEN, or curseforge_token / modrinth_token in ~/.gradle/gradle.properties.
# Without a token the upload for that site runs as a dry run. An empty project id skips that site.
# release_type: release, beta or alpha
release_type=beta
curseforge_project_id=268178
modrinth_project_id=4yAD8NG9
# false keeps every upload a dry run (checkRelease then refuses to release); enabled for 1.0.0-beta.6 (decided by the user)
publish_enabled=true
