# Gradle
org.gradle.jvmargs=-Xmx3G

# Mod
mod_id=openmodularlighting
mod_name=Open Modular Lighting
mod_version=1.0.0-beta.5
maven_group=omtteam.openmodularlighting
archives_base_name=openmodularlighting

# Minecraft 1.12.2 / Forge (RetroFuturaGradle picks the matching Forge build itself)
minecraft_version=1.12.2
java_version=8
# MCP mappings
mapping_channel=stable
mapping_version=39

# Unit tests (JUnit 5: the last line that runs on Java 8)
junit_version=5.13.4

# Publishing (./gradlew publishMods). Tokens are NOT stored here: set the environment variables
# CURSEFORGE_TOKEN / MODRINTH_TOKEN, or curseforge_token / modrinth_token in ~/.gradle/gradle.properties.
# Without a token the upload for that site runs as a dry run. An empty project id skips that site.
# release_type: release, beta or alpha
release_type=beta
curseforge_project_id=268178
modrinth_project_id=4yAD8NG9
# The 1.12.2 build is not released yet: keep every upload a dry run until this is set to true
publish_enabled=false
