modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "MIT (code), CC-BY-NC-SA-4.0 (art)"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Keridos"
description = "Floodlights that light up large areas, grow lights for crops and UV lights against mobs."
displayURL = "https://www.curseforge.com/minecraft/mc-mods/floodlights"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "omlib"
mandatory = true
versionRange = "[${omlib_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jade"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "BOTH"
