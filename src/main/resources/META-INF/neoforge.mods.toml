modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT (code), CC-BY-NC-SA-4.0 (art)"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Keridos"
description = "Floodlights that light up large areas, grow lights for crops and UV lights against mobs."
displayURL = "https://www.curseforge.com/minecraft/mc-mods/floodlights"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
