# Connected textures for Continuity / OptiFine-compatible CTM mods. Without such a mod this file is ignored and the
# block uses the plain texture. The tiles 0-4 are cut from textures/block/lightproof_glass.png (2 px frame):
# 0 unconnected, 1 fully connected, 2 up and down, 3 left and right, 4 only the corners of the frame
method=ctm_compact
matchBlocks=openmodularlighting:lightproof_glass
tiles=0-4
connect=block
innerSeams=false
